spring:
  datasource:
    url: jdbc:h2:mem:davkit;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  ssl:
    enabled: false

davkit:
  enabled: true
  # Deliberately no key: unpublished test-source support supplies the test context's internal state,
  # so a clone builds green without reusable key material or a production bypass.
  auth:
    ofba:
      enabled: true
  signed-url:
    keys:
      test: test-signing-key-0123456789abcdef0123456789
